name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swipl:stable
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        run: swipl -q -g run_tests -t halt tests/todos.pl
      - name: Partidas largas entre IAs
        run: swipl tests/partidas_largas.pl
